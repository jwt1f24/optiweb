<!DOCTYPE html>
<html>
    <head>
        <title>OptiWeb</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="popup.css"/>
    </head>
    <body>
        <main>
            <!-- header -->
            <div class="header">
                <h1>OptiWeb</h1>

                <!-- extension toggle setting -->
                <div class="option">
                    <p id="stateLabel">Enabled</p>
                    <label class="toggle-switch">
                        <input type="checkbox" id="extensionToggle" checked>
                        <span class="slider"></span>
                    </label>
                </div>
            </div>

            <!-- navbar -->
            <div class="navbar">
                <button class="nav-btn active" data-target="dashboard">Dashboard</button>
                <button class="nav-btn" data-target="tabList">Tab List</button>
                <button class="nav-btn" data-target="settings">Settings</button>
            </div>
            
            <!-- dashboard section -->
            <div class="section" id="dashboard">
                <div class="content-container" id="dashboardContent">
                    <!-- statistic display -->
                    <div class="stat-container">
                        <div class="stat-row">
                            <span>Memory Usage:</span>
                            <span id="memUsage">0.0 GB</span>
                        </div>
                        <div class="stat-row">
                            <span>Memory Available:</span>
                            <span id="memAvailable">0.0 GB</span>
                        </div>
                    </div>
                    <div class="stat-container">
                        <div class="stat-row">
                            <span>Active Tabs:</span>
                            <span id="activeCount">0</span>
                        </div>
                        <div class="stat-row">
                            <span>Pinned Tabs:</span>
                            <span id="pinnedCount">0</span>
                        </div>
                        <div class="stat-row">
                            <span>Tabs Playing Audio:</span>
                            <span id="audibleCount">0</span>
                        </div>
                        <div class="stat-row">
                            <span>Discarded Tabs:</span>
                            <span id="freezeCount">0</span>
                        </div>
                    </div>

                    <!-- button to execute optimization action -->
                    <button class="opt-btn" id="optBtn">Optimize</button>
                </div>    
            </div>

            <!-- tab list section -->
            <div class="section" id="tabList">
                <div class="content-container" id="tabListContent">
                    <!-- secondary navbar for all tabs & whitelist sections -->
                    <div class="list-navbar">
                        <button class="list-nav-btn active" data-target="allTabsView">All Tabs</button>
                        <button class="list-nav-btn" data-target="whitelistView">Whitelist</button>
                    </div>

                    <!-- list containers -->
                    <div class="list-container" id="allTabsView">
                        <div id="listTabs"></div>
                    </div>
                    <div class="list-container" id="whitelistView">
                        <div class="domain-input" id="domainInput">
                            <input type="text" id="domainField" placeholder="e.g. www.google.com"/>
                            <button id="domainBtn">Add</button>
                        </div>
                        <div id="whitelistedDomains"></div>
                    </div>
                </div>
            </div>

            <!-- settings section -->
            <div class="section" id="settings">
                <div class="content-container" id="settingsContent">
                    <!-- optimization settings -->
                    <div class="setting-category">                       
                        <h2 class="settings-label">Optimization Settings</h2>
                        
                        <div class="opt-setting">
                            <div class="option">
                                <label class="toggle-switch">
                                    <input type="checkbox" id="minuteCheck">
                                    <span class="slider"></span>
                                </label>
                                <p>Clean every (mins.)</p>
                            </div>
                            <div class="number-input">
                                <input type="number" id="minuteValue" min="1" max="1440" value="1">
                                <div class="number-input-btn">
                                    <button id="minuteUp">▲</button>
                                    <button id="minuteDown">▼</button>
                                </div>
                            </div>
                        </div>
                        
                        <div class="opt-setting">
                            <div class="option">
                                <label class="toggle-switch">
                                    <input type="checkbox" id="unfocusedCheck">
                                    <span class="slider"></span>
                                </label>
                                <p>Clean inactive tab after</p>
                            </div>
                            <div class="dropdown">
                                <select class="time-dropdown" id="unfocusedValue">
                                    <option value="1">1 min</option>
                                    <option value="5" selected>5 mins</option>
                                    <option value="10">10 mins</option>
                                    <option value="30">30 mins</option>
                                    <option value="60">1 hour</option>
                                </select>
                            </div>
                        </div>
                        
                        <div class="opt-setting-last">
                            <div class="option">
                                <label class="toggle-switch">
                                    <input type="checkbox" id="notifCheck">
                                    <span class="slider"></span>
                                </label>
                                <p>Enable notifications</p>
                            </div>
                        </div>
                    </div>

                    <!-- display theme settings -->
                    <div class="setting-category">
                        <h2 class="settings-label">Display Theme</h2>
                        
                        <div class="theme-bar">
                            <button class="theme-btn" id="light">Light</button>
                            <button class="theme-btn" id="dark">Dark</button>
                        </div>
                    </div>

                    <!-- hotkey settings -->
                    <div class="setting-category">
                        <h2 class="settings-label">Hotkeys</h2>
                        
                        <div class="opt-setting">
                            <div class="option">
                                <p>Manage keyboard shortcuts</p>
                            </div>
                            <button class="hotkey-btn" id="hotkeyBtn">View</button>
                        </div>
                    </div>
                </div>
            </div>
        </main>    
        <script src="/shared.js"></script>
        <script src="popup.js"></script>
    </body>
</html>
