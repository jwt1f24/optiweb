<!DOCTYPE html>
<html>
    <head>
        <title>OptiWeb</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="popup.css"/>
    </head>
    <body>
        <main>
            <h1>OptiWeb</h1>

            <!-- navbar -->
            <div class="navbar">
                <button class="nav-btn" data-target="dashboard">Dashboard</button>
                <button class="nav-btn" data-target="tabList">Tab List</button>
                <button class="nav-btn" data-target="settings">Settings</button>
            </div>
            
            <!-- dashboard section -->
            <div class="section" id="dashboard">
                <!-- statistic display -->
                <div class="stat-container">
                    <div class="stat-row">
                        <span>Memory Usage:</span>
                        <span id="memUsage">0.0 GB</span>
                    </div>
                    <div class="stat-row">
                        <span>Memory Available:</span>
                        <span id="memAvailable">0.0 GB</span>
                    </div>
                </div>
                <div class="stat-container">
                    <div class="stat-row">
                        <span>Active Tabs:</span>
                        <span id="activeCount">0</span>
                    </div>
                    <div class="stat-row">
                        <span>Freeze Tabs:</span>
                        <span id="freezeCount">0</span>
                    </div>
                </div>
                <!-- button to execute optimization action -->
                <button class="opt-btn" id="optBtn">Optimize</button>
            </div>

            <!-- tab list section -->
            <div class="section" id="tabList">
                <div class="list-navbar">
                    <button class="list-nav-btn" data-target="allTabsView">All Tabs</button>
                    <button class="list-nav-btn" data-target="whitelistView">Whitelist</button>
                </div>

                <!-- list containers -->
                <div class="list-container" id="allTabsView">
                    <div id="listTabs"></div>
                </div>
                <div class="list-container" id="whitelistView">
                    <div class="domain-input" id="domainInput">
                        <input type="text" id="domainField" placeholder="e.g. www.google.com"/>
                        <button id="domainBtn">Add</button>
                    </div>
                    <div id="whitelistedDomains"></div>
                </div>
            </div>

            <!-- settings section -->
            <div class="section" id="settings">
                <!-- display theme settings -->
                <h3 class="settings-label">Theme</h3>
                <div class="theme-bar">
                    <button class="theme-btn" id="dark">Dark</button>
                    <button class="theme-btn" id="light">Light</button>
                </div>

                <!-- automated optimization settings -->
                <h3 class="settings-label">Optimization Management</h3>
                <div class="opt-setting">
                    <input type="checkbox">
                    <p>Clean when above: (%)</p>
                    <input type="number">
                </div>
                <div class="opt-setting">
                    <input type="checkbox">
                    <p>Clean every: (mins.)</p>
                    <input type="number">
                </div>

                <!-- miscellaneous settings -->
                <h3 class="settings-label">Miscellaneous</h3>
                <div class="misc-setting">
                    <input type="checkbox" id="notifCheck">
                    <p>Enable cleaning result notifications</p>
                </div>
            </div>
        </main>    
        <script src="popup.js"></script>
    </body>
</html>
